<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">
  <title>经典像素坦克大战 - 移动掌机版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    :root {
      --primary: #ffd700;
      --accent: #ff3344;
      --turbo: #ff9800;
      --dpad-bg: #222226;
      --dpad-active: #ff3344;
      --body-bg: #141416;
      --screen-bezel: #252528;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background: var(--body-bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }

    /* Handheld Console Layout */
    #console-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px);
      box-sizing: border-box;
    }

    /* Screen Area with Bezel */
    #screen-section {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* LCD Header HUD */
    #lcd-hud {
      width: 100%;
      background: var(--screen-bezel);
      border: 3px solid #38383c;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 900;
      color: #bbb;
      letter-spacing: 0.5px;
    }
    .hud-chip {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hud-num {
      color: var(--primary);
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    /* Retro CRT Canvas Screen */
    #screen-bezel {
      width: 100%;
      max-width: min(94vw, 44vh);
      aspect-ratio: 1 / 1;
      background: #000;
      border: 3px solid #38383c;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Gamepad Deck Area (Bottom Half) */
    #gamepad-deck {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      flex: 1;
      min-height: 220px;
      touch-action: none;
    }

    /* System Micro-buttons (Sound, Pause, Fullscreen, Restart) */
    .system-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding-top: 4px;
    }
    .pill-btn {
      background: #2c2c32;
      border: 1px solid #444;
      color: #aaa;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    .pill-btn:active, .pill-btn.active {
      background: #444;
      color: #fff;
      transform: translateY(1px);
    }

    /* Main Touch Controls: D-Pad on Left, Buttons on Right */
    .main-controls-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    /* Responsive Sliding Cross D-Pad */
    .dpad-touchzone {
      width: 154px;
      height: 154px;
      position: relative;
      background: radial-gradient(circle, #25252a 0%, #151518 70%);
      border: 3px solid #333338;
      border-radius: 50%;
      box-shadow: inset 0 3px 12px rgba(0,0,0,0.9), 0 4px 14px rgba(0,0,0,0.6);
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-cross {
      position: absolute;
      width: 116px;
      height: 116px;
      pointer-events: none;
    }
    .dpad-arm {
      position: absolute;
      background: #2a2a30;
      border: 2px solid #3e3e46;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #777;
      transition: all 0.08s ease;
    }
    .dpad-arm.active {
      background: var(--dpad-active);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 12px var(--dpad-active);
      transform: scale(0.96);
    }
    .dpad-arm.up {
      top: 0; left: 38px; width: 40px; height: 42px; border-bottom: none; border-radius: 8px 8px 0 0;
    }
    .dpad-arm.down {
      bottom: 0; left: 38px; width: 40px; height: 42px; border-top: none; border-radius: 0 0 8px 8px;
    }
    .dpad-arm.left {
      top: 38px; left: 0; width: 42px; height: 40px; border-right: none; border-radius: 8px 0 0 8px;
    }
    .dpad-arm.right {
      top: 38px; right: 0; width: 42px; height: 40px; border-left: none; border-radius: 0 8px 8px 0;
    }
    .dpad-core {
      top: 38px; left: 38px; width: 40px; height: 40px;
      background: #1c1c20;
      position: absolute;
      border-radius: 4px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }
    .dpad-indicator-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, #888);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transition: transform 0.04s ease-out;
    }

    /* Dual Action Arcade Buttons */
    .arcade-buttons-group {
      display: flex;
      align-items: center;
      gap: 18px;
      transform: rotate(-12deg); /* Classic Game Boy diagonal angle */
    }
    .arcade-btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .arcade-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.4);
      cursor: pointer;
      touch-action: none;
      font-weight: 900;
      color: #fff;
    }
    .arcade-btn:active, .arcade-btn.active {
      transform: scale(0.92) translateY(2px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .arcade-btn.btn-a {
      background: radial-gradient(circle at 35% 35%, #ff4b4b, #b71c1c);
      border: 3px solid #ff7b7b;
    }
    .arcade-btn.btn-a:active, .arcade-btn.btn-a.active {
      background: #e50914;
    }
    .arcade-btn.btn-b {
      background: radial-gradient(circle at 35% 35%, #ffb300, #e65100);
      border: 3px solid #ffd54f;
    }
    .arcade-btn.btn-b:active, .arcade-btn.btn-b.active {
      background: #ff6d00;
    }
    .btn-letter {
      font-size: 20px;
      line-height: 1;
    }
    .btn-tag {
      font-size: 10px;
      opacity: 0.9;
      font-weight: normal;
      margin-top: 1px;
    }
    .btn-label-outside {
      font-size: 11px;
      font-weight: 800;
      color: #777;
      letter-spacing: 0.5px;
    }

    /* Landscape Mode for Handheld Feel */
    @media (orientation: landscape) and (max-height: 520px) {
      #console-wrapper {
        flex-direction: row;
        justify-content: space-around;
        padding: 4px 14px;
      }
      #screen-section {
        max-width: min(86vh, 416px);
      }
      #screen-bezel {
        max-width: min(80vh, 416px);
      }
      #gamepad-deck {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        padding: 0 24px;
        pointer-events: none;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        padding-bottom: 18px;
      }
      .system-row {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        pointer-events: auto;
      }
      .main-controls-row {
        width: 100%;
        justify-content: space-between;
        pointer-events: none;
      }
      .dpad-touchzone, .arcade-buttons-group {
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <div id="console-wrapper">
    <!-- Top Screen Area -->
    <div id="screen-section">
      <div id="lcd-hud">
        <div class="hud-chip">🚩 关卡 <span class="hud-num" id="hudStage">1</span></div>
        <div class="hud-chip">💖 命 <span class="hud-num" id="hudLives">3</span></div>
        <div class="hud-chip">🏆 分 <span class="hud-num" id="hudScore">0</span></div>
        <div class="hud-chip">👾 敌 <span class="hud-num" id="hudEnemies">20</span></div>
      </div>
      <div id="screen-bezel">
        <canvas id="gameCanvas" width="416" height="416"></canvas>
      </div>
    </div>

    <!-- Handheld Gamepad Deck -->
    <div id="gamepad-deck">
      <!-- System Bar -->
      <div class="system-row">
        <button class="pill-btn" id="btn-sound">🔊 声音</button>
        <button class="pill-btn" id="btn-pause">⏸ 暂停</button>
        <button class="pill-btn" id="btn-fullscreen">⛶ 全屏</button>
        <button class="pill-btn" id="btn-restart">🔄 重开</button>
      </div>

      <!-- Controls Row: D-Pad on Left, Action Buttons on Right -->
      <div class="main-controls-row">
        <!-- Tactile Slide D-Pad -->
        <div class="dpad-touchzone" id="dpadZone">
          <div class="dpad-cross">
            <div class="dpad-arm up" id="arm-up">▲</div>
            <div class="dpad-arm down" id="arm-down">▼</div>
            <div class="dpad-arm left" id="arm-left">◀</div>
            <div class="dpad-arm right" id="arm-right">▶</div>
            <div class="dpad-core"></div>
          </div>
          <div class="dpad-indicator-dot" id="dpadDot"></div>
        </div>

        <!-- Arcade Action Buttons -->
        <div class="arcade-buttons-group">
          <!-- B Button: Turbo Continuous Fire -->
          <div class="arcade-btn-wrapper">
            <div class="arcade-btn btn-b" id="btn-turbo">
              <span class="btn-letter">B</span>
              <span class="btn-tag">极速</span>
            </div>
            <span class="btn-label-outside">连发</span>
          </div>

          <!-- A Button: Main Fire -->
          <div class="arcade-btn-wrapper">
            <div class="arcade-btn btn-a" id="btn-fire">
              <span class="btn-letter">A</span>
              <span class="btn-tag">开火</span>
            </div>
            <span class="btn-label-outside">主炮</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       Chiptune Audio Synthesizer (Zero External Assets)
       ========================================================================== */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      vibrate(ms) {
        if (navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }
      playShoot() {
        if (!this.enabled || !this.ctx) return;
        this.vibrate(12);
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      playHitBrick() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.07);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playHitSteel() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1050, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.09);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      playExplosion() {
        if (!this.enabled || !this.ctx) return;
        this.vibrate([30, 20, 40]);
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.28;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(380, now);
        filter.frequency.linearRampToValueAtTime(50, now + 0.28);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playPowerup() {
        if (!this.enabled || !this.ctx) return;
        this.vibrate([15, 30, 15]);
        const notes = [330, 440, 554, 659, 880];
        const now = this.ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.18, now + idx * 0.05);
          gain.gain.linearRampToValueAtTime(0, now + idx * 0.05 + 0.045);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.05);
        });
      }
      playStageStart() {
        if (!this.enabled || !this.ctx) return;
        const melody = [
          {f: 261, d: 0.1}, {f: 329, d: 0.1}, {f: 392, d: 0.1},
          {f: 523, d: 0.2}, {f: 392, d: 0.1}, {f: 523, d: 0.3}
        ];
        let t = this.ctx.currentTime;
        melody.forEach(m => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(m.f, t);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.linearRampToValueAtTime(0, t + m.d * 0.85);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + m.d);
          t += m.d;
        });
      }
      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        this.vibrate([100, 50, 120]);
        const notes = [390, 330, 280, 210];
        let t = this.ctx.currentTime;
        notes.forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
          t += 0.2;
        });
      }
    }
    const sound = new SoundManager();

    /* ==========================================================================
       Map & Game Constants
       ========================================================================== */
    const TILE_SIZE = 16;
    const MAP_COLS = 26;
    const MAP_ROWS = 26;
    const CANVAS_WIDTH = 416;
    const CANVAS_HEIGHT = 416;

    const T_EMPTY = 0;
    const T_BRICK = 1;
    const T_STEEL = 2;
    const T_WATER = 3;
    const T_TREE  = 4;
    const T_BASE  = 5;
    const T_BASE_RUIN = 6;

    const DIR_UP = 0;
    const DIR_RIGHT = 1;
    const DIR_DOWN = 2;
    const DIR_LEFT = 3;

    function generateMap(stage = 1) {
      const map = Array(MAP_ROWS).fill(0).map(() => Array(MAP_COLS).fill(T_EMPTY));
      function fillBlock(r1, c1, r2, c2, type) {
        for (let r = r1; r <= r2; r++) {
          for (let c = c1; c <= c2; c++) {
            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) map[r][c] = type;
          }
        }
      }

      fillBlock(2, 2, 8, 3, T_BRICK);
      fillBlock(2, 6, 8, 7, T_BRICK);
      fillBlock(2, 10, 6, 11, T_BRICK);
      fillBlock(2, 14, 6, 15, T_BRICK);
      fillBlock(2, 18, 8, 19, T_BRICK);
      fillBlock(2, 22, 8, 23, T_BRICK);

      fillBlock(8, 12, 9, 13, T_STEEL);

      fillBlock(11, 2, 12, 5, T_BRICK);
      fillBlock(11, 8, 14, 9, T_BRICK);
      fillBlock(11, 16, 14, 17, T_BRICK);
      fillBlock(11, 20, 12, 23, T_BRICK);

      fillBlock(13, 11, 15, 14, T_TREE);

      fillBlock(16, 0, 16, 4, T_WATER);
      fillBlock(16, 21, 16, 25, T_WATER);

      fillBlock(18, 2, 21, 3, T_BRICK);
      fillBlock(18, 6, 21, 7, T_BRICK);
      fillBlock(18, 18, 21, 19, T_BRICK);
      fillBlock(18, 22, 21, 23, T_BRICK);

      fillBlock(18, 10, 19, 11, T_STEEL);
      fillBlock(18, 14, 19, 15, T_STEEL);

      // Base Shield
      fillBlock(23, 11, 25, 11, T_BRICK);
      fillBlock(23, 14, 25, 14, T_BRICK);
      fillBlock(23, 12, 23, 13, T_BRICK);

      // Eagle Base
      map[24][12] = T_BASE;
      map[24][13] = T_BASE;
      map[25][12] = T_BASE;
      map[25][13] = T_BASE;

      return map;
    }

    /* ==========================================================================
       Bullet Class
       ========================================================================== */
    class Bullet {
      constructor(x, y, dir, speed, isPlayer, power = 1) {
        this.x = x;
        this.y = y;
        this.dir = dir;
        this.speed = speed;
        this.isPlayer = isPlayer;
        this.power = power;
        this.alive = true;
        this.size = 4;
      }
      update(dt, game) {
        const dist = this.speed * dt;
        if (this.dir === DIR_UP) this.y -= dist;
        else if (this.dir === DIR_DOWN) this.y += dist;
        else if (this.dir === DIR_LEFT) this.x -= dist;
        else if (this.dir === DIR_RIGHT) this.x += dist;

        if (this.x < 0 || this.x > CANVAS_WIDTH - this.size ||
            this.y < 0 || this.y > CANVAS_HEIGHT - this.size) {
          this.alive = false;
          game.spawnSparks(this.x, this.y);
          if (this.isPlayer) sound.playHitSteel();
          return;
        }

        const centerCol = Math.floor((this.x + this.size / 2) / TILE_SIZE);
        const centerRow = Math.floor((this.y + this.size / 2) / TILE_SIZE);

        if (centerRow >= 0 && centerRow < MAP_ROWS && centerCol >= 0 && centerCol < MAP_COLS) {
          const tile = game.map[centerRow][centerCol];
          if (tile === T_BRICK) {
            this.alive = false;
            game.map[centerRow][centerCol] = T_EMPTY;
            game.spawnSparks(this.x, this.y, '#c35832');
            sound.playHitBrick();
            return;
          } else if (tile === T_STEEL) {
            this.alive = false;
            if (this.power >= 2) game.map[centerRow][centerCol] = T_EMPTY;
            game.spawnSparks(this.x, this.y, '#ffffff');
            sound.playHitSteel();
            return;
          } else if (tile === T_BASE) {
            this.alive = false;
            game.destroyBase();
            return;
          }
        }

        if (this.isPlayer) {
          for (let enemy of game.enemies) {
            if (enemy.alive && game.checkAABB(this.x, this.y, this.size, this.size, enemy.x, enemy.y, enemy.size, enemy.size)) {
              this.alive = false;
              enemy.hit(this.power, game);
              return;
            }
          }
        } else {
          if (game.player && game.player.alive) {
            if (game.checkAABB(this.x, this.y, this.size, this.size, game.player.x, game.player.y, game.player.size, game.player.size)) {
              this.alive = false;
              game.player.hit(game);
              return;
            }
          }
        }

        for (let other of game.bullets) {
          if (other !== this && other.alive && other.isPlayer !== this.isPlayer) {
            if (Math.abs(this.x - other.x) < 8 && Math.abs(this.y - other.y) < 8) {
              this.alive = false;
              other.alive = false;
              game.spawnSparks(this.x, this.y, '#ffff00');
              return;
            }
          }
        }
      }
      draw(ctx) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x + this.size/2, this.y + this.size/2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* ==========================================================================
       Tank Base Class & Inheritors
       ========================================================================== */
    class Tank {
      constructor(x, y, dir, speed, color, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.dir = dir;
        this.speed = speed;
        this.color = color;
        this.isPlayer = isPlayer;
        this.size = 28;
        this.alive = true;
        this.trackFrame = 0;
        this.trackTimer = 0;
        this.reloadTime = 0.42;
        this.reloadTimer = 0;
        this.shieldTimer = 0;
      }
      move(dt, dir, game) {
        this.dir = dir;
        const dist = this.speed * dt;
        let nx = this.x;
        let ny = this.y;

        if (dir === DIR_UP) ny -= dist;
        else if (dir === DIR_DOWN) ny += dist;
        else if (dir === DIR_LEFT) nx -= dist;
        else if (dir === DIR_RIGHT) nx += dist;

        this.trackTimer += dt;
        if (this.trackTimer > 0.08) {
          this.trackFrame = 1 - this.trackFrame;
          this.trackTimer = 0;
        }

        if (nx < 0) nx = 0;
        if (nx > CANVAS_WIDTH - this.size) nx = CANVAS_WIDTH - this.size;
        if (ny < 0) ny = 0;
        if (ny > CANVAS_HEIGHT - this.size) ny = CANVAS_HEIGHT - this.size;

        if (!game.checkTankObstacleCollision(nx, ny, this.size, this)) {
          this.x = nx;
          this.y = ny;
          return true;
        }
        return false;
      }
      fire(game) {
        if (this.reloadTimer <= 0) {
          this.reloadTimer = this.reloadTime;
          let bx = this.x + this.size / 2 - 2;
          let by = this.y + this.size / 2 - 2;
          if (this.dir === DIR_UP) by = this.y - 4;
          else if (this.dir === DIR_DOWN) by = this.y + this.size;
          else if (this.dir === DIR_LEFT) bx = this.x - 4;
          else if (this.dir === DIR_RIGHT) bx = this.x + this.size;

          const bulletSpeed = this.isPlayer ? 245 : 160;
          game.bullets.push(new Bullet(bx, by, this.dir, bulletSpeed, this.isPlayer));
          if (this.isPlayer) sound.playShoot();
          return true;
        }
        return false;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
        const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
        ctx.rotate(angles[this.dir]);

        const s = this.size;
        const hs = s / 2;

        // Tracks
        ctx.fillStyle = '#222';
        ctx.fillRect(-hs, -hs, 6, s);
        ctx.fillRect(hs - 6, -hs, 6, s);

        ctx.fillStyle = this.trackFrame === 0 ? '#555' : '#888';
        for (let i = -hs + 2; i < hs; i += 6) {
          ctx.fillRect(-hs + 1, i, 4, 3);
          ctx.fillRect(hs - 5, i, 4, 3);
        }

        // Body
        ctx.fillStyle = this.color;
        ctx.fillRect(-hs + 6, -hs + 3, s - 12, s - 6);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(-hs + 7, -hs + 4, s - 14, 3);

        // Turret
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(0, 1, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 1, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Barrel
        ctx.fillStyle = '#eee';
        ctx.fillRect(-2, -hs - 2, 4, hs + 3);

        ctx.restore();

        if (this.shieldTimer > 0) {
          ctx.save();
          ctx.strokeStyle = Math.floor(Date.now() / 60) % 2 === 0 ? '#00e5ff' : '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2 + 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    class PlayerTank extends Tank {
      constructor(x, y) {
        super(x, y, DIR_UP, 110, '#ffd700', true);
        this.shieldTimer = 3.5;
      }
      hit(game) {
        if (this.shieldTimer > 0) return;
        sound.playExplosion();
        game.spawnExplosion(this.x + this.size / 2, this.y + this.size / 2, true);
        this.alive = false;
        game.playerLives--;
        game.updateHUD();
        if (game.playerLives > 0) {
          setTimeout(() => game.respawnPlayer(), 1000);
        } else {
          game.gameOver();
        }
      }
    }

    class EnemyTank extends Tank {
      constructor(x, y, type = 'basic') {
        let speed = 65;
        let color = '#ccc';
        let hp = 1;
        if (type === 'fast') {
          speed = 125;
          color = '#81c784';
        } else if (type === 'armor') {
          speed = 55;
          color = '#e57373';
          hp = 3;
        } else if (type === 'bonus') {
          speed = 80;
          color = '#ff4081';
        }
        super(x, y, DIR_DOWN, speed, color, false);
        this.type = type;
        this.hp = hp;
        this.changeDirTimer = Math.random() * 1.5 + 0.5;
        this.shootTimer = Math.random() * 1.8 + 0.6;
      }
      update(dt, game) {
        if (game.freezeTimer > 0) return;

        this.changeDirTimer -= dt;
        if (this.changeDirTimer <= 0) {
          this.changeDirTimer = Math.random() * 2.0 + 1.0;
          const r = Math.random();
          if (r < 0.45) this.dir = DIR_DOWN;
          else if (r < 0.65) this.dir = DIR_LEFT;
          else if (r < 0.85) this.dir = DIR_RIGHT;
          else this.dir = DIR_UP;
        }

        const moved = this.move(dt, this.dir, game);
        if (!moved) {
          const otherDirs = [DIR_UP, DIR_RIGHT, DIR_DOWN, DIR_LEFT].filter(d => d !== this.dir);
          this.dir = otherDirs[Math.floor(Math.random() * otherDirs.length)];
          this.changeDirTimer = 0.5 + Math.random() * 0.5;
        }

        this.shootTimer -= dt;
        if (this.shootTimer <= 0) {
          this.shootTimer = Math.random() * 1.6 + 0.8;
          this.fire(game);
        }
      }
      hit(power, game) {
        this.hp -= power;
        if (this.hp <= 0) {
          this.alive = false;
          sound.playExplosion();
          game.spawnExplosion(this.x + this.size / 2, this.y + this.size / 2);
          game.score += (this.type === 'armor' ? 400 : (this.type === 'fast' ? 200 : 100));
          game.updateHUD();

          if (this.type === 'bonus' || Math.random() < 0.25) {
            game.spawnPowerup(this.x, this.y);
          }
          game.checkStageClear();
        } else {
          this.color = this.hp === 2 ? '#fff59d' : '#ff8a80';
          sound.playHitSteel();
        }
      }
    }

    /* ==========================================================================
       Power-up Items & Particles
       ========================================================================== */
    class Powerup {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.size = 20;
        this.type = type;
        this.alive = true;
        this.timer = 15;
      }
      update(dt) {
        this.timer -= dt;
        if (this.timer <= 0) this.alive = false;
      }
      draw(ctx) {
        if (!this.alive) return;
        if (this.timer < 3 && Math.floor(Date.now() / 150) % 2 === 0) return;

        ctx.save();
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(this.x, this.y, this.size, this.size);

        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let symbol = '★';
        if (this.type === 'bomb') symbol = '💣';
        else if (this.type === 'timer') symbol = '⏱';
        else if (this.type === 'shield') symbol = '🛡';
        else if (this.type === 'shovel') symbol = '⛏';
        ctx.fillText(symbol, this.x + this.size / 2, this.y + this.size / 2 + 1);
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color = '#ff5722', size = 3, vx = 0, vy = 0, life = 0.3) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
      }
      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
      }
      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    class Explosion {
      constructor(x, y, isBig = false) {
        this.x = x;
        this.y = y;
        this.radius = isBig ? 32 : 18;
        this.duration = 0.32;
        this.timer = 0;
        this.alive = true;
      }
      update(dt) {
        this.timer += dt;
        if (this.timer >= this.duration) this.alive = false;
      }
      draw(ctx) {
        const progress = this.timer / this.duration;
        const currentR = this.radius * (0.3 + progress * 0.7);
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, currentR, 0, Math.PI * 2);
        ctx.fillStyle = progress < 0.4 ? '#ffff00' : (progress < 0.7 ? '#ff5722' : '#777');
        ctx.fill();
        ctx.restore();
      }
    }

    /* ==========================================================================
       Main Mobile Game Engine
       ========================================================================== */
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;

        this.stage = 1;
        this.score = 0;
        this.playerLives = 3;
        this.state = 'TITLE';

        this.map = generateMap(this.stage);
        this.player = null;
        this.enemies = [];
        this.bullets = [];
        this.powerups = [];
        this.particles = [];
        this.explosions = [];

        this.spawnQueue = [];
        this.spawnTimer = 0;
        this.freezeTimer = 0;
        this.shovelTimer = 0;

        // Current Active Direction (DIR_UP, DIR_RIGHT, DIR_DOWN, DIR_LEFT, or null)
        this.touchDir = null;
        this.isFiringA = false;
        this.isFiringB = false;

        this.lastTime = performance.now();

        this.initMobileControls();
        this.updateHUD();
      }

      initMobileControls() {
        // Universal Touch-to-Audio Unlock
        const unlockAudio = () => {
          sound.init();
          window.removeEventListener('touchstart', unlockAudio);
        };
        window.addEventListener('touchstart', unlockAudio, { passive: true });

        // Tactile Smooth Sliding Cross D-Pad
        const dpadZone = document.getElementById('dpadZone');
        const dpadDot = document.getElementById('dpadDot');
        const armUp = document.getElementById('arm-up');
        const armDown = document.getElementById('arm-down');
        const armLeft = document.getElementById('arm-left');
        const armRight = document.getElementById('arm-right');

        let isTouchingDpad = false;
        let dpadCenterX = 0;
        let dpadCenterY = 0;
        const maxRadius = 38;

        const setDirection = (dir, dx = 0, dy = 0) => {
          if (this.touchDir !== dir && dir !== null) {
            sound.vibrate(10);
          }
          this.touchDir = dir;

          armUp.classList.toggle('active', dir === DIR_UP);
          armDown.classList.toggle('active', dir === DIR_DOWN);
          armLeft.classList.toggle('active', dir === DIR_LEFT);
          armRight.classList.toggle('active', dir === DIR_RIGHT);

          const dist = Math.hypot(dx, dy);
          const clamped = Math.min(dist, maxRadius);
          const angle = Math.atan2(dy, dx);
          const kx = Math.cos(angle) * clamped;
          const ky = Math.sin(angle) * clamped;
          dpadDot.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
        };

        const resetDpad = () => {
          isTouchingDpad = false;
          this.touchDir = null;
          armUp.classList.remove('active');
          armDown.classList.remove('active');
          armLeft.classList.remove('active');
          armRight.classList.remove('active');
          dpadDot.style.transform = `translate(-50%, -50%)`;
        };

        const handleDpadCoord = (clientX, clientY) => {
          const dx = clientX - dpadCenterX;
          const dy = clientY - dpadCenterY;
          const dist = Math.hypot(dx, dy);
          const deadzone = 12;

          if (dist < deadzone) {
            setDirection(null, dx, dy);
            return;
          }

          if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(dx > 0 ? DIR_RIGHT : DIR_LEFT, dx, dy);
          } else {
            setDirection(dy > 0 ? DIR_DOWN : DIR_UP, dx, dy);
          }
        };

        dpadZone.addEventListener('touchstart', (e) => {
          e.preventDefault();
          sound.init();
          const rect = dpadZone.getBoundingClientRect();
          dpadCenterX = rect.left + rect.width / 2;
          dpadCenterY = rect.top + rect.height / 2;
          isTouchingDpad = true;

          const touch = e.touches[0];
          handleDpadCoord(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
          if (!isTouchingDpad) return;
          e.preventDefault();
          for (let i = 0; i < e.touches.length; i++) {
            const touch = e.touches[i];
            const dx = touch.clientX - dpadCenterX;
            const dy = touch.clientY - dpadCenterY;
            if (Math.hypot(dx, dy) < maxRadius * 3.0) {
              handleDpadCoord(touch.clientX, touch.clientY);
              break;
            }
          }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
          if (isTouchingDpad && e.touches.length === 0) resetDpad();
        });
        window.addEventListener('touchcancel', () => resetDpad());

        // Arcade Action Buttons (A: Main Fire, B: Turbo Rapid Fire)
        const btnFire = document.getElementById('btn-fire');
        const btnTurbo = document.getElementById('btn-turbo');

        const bindBtn = (el, onStart, onEnd) => {
          el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sound.init();
            el.classList.add('active');
            onStart();
          }, { passive: false });
          const end = (e) => {
            e.preventDefault();
            el.classList.remove('active');
            onEnd();
          };
          el.addEventListener('touchend', end, { passive: false });
          el.addEventListener('touchcancel', end, { passive: false });
        };

        bindBtn(btnFire, () => { this.isFiringA = true; }, () => { this.isFiringA = false; });
        bindBtn(btnTurbo, () => { this.isFiringB = true; }, () => { this.isFiringB = false; });

        // Screen Touch to Start / Next Stage / Retry
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          sound.init();
          if (this.state === 'TITLE' || this.state === 'GAMEOVER') {
            this.startStage(1);
          } else if (this.state === 'STAGECLEAR') {
            this.startStage(this.stage + 1);
          } else if (this.state === 'PAUSED') {
            this.togglePause();
          }
        }, { passive: false });

        // System Buttons
        document.getElementById('btn-sound').addEventListener('click', () => {
          sound.init();
          sound.enabled = !sound.enabled;
          document.getElementById('btn-sound').innerText = `🔊 声音: ${sound.enabled ? '开' : '关'}`;
        });
        document.getElementById('btn-pause').addEventListener('click', () => this.togglePause());
        document.getElementById('btn-restart').addEventListener('click', () => {
          sound.init();
          this.startStage(1);
        });
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }

      startStage(stageNum) {
        this.stage = stageNum;
        this.map = generateMap(this.stage);
        this.bullets = [];
        this.enemies = [];
        this.powerups = [];
        this.particles = [];
        this.explosions = [];
        this.freezeTimer = 0;
        this.shovelTimer = 0;

        this.spawnQueue = [];
        for (let i = 0; i < 20; i++) {
          if (i === 4 || i === 11 || i === 18) this.spawnQueue.push('bonus');
          else if (i % 4 === 1) this.spawnQueue.push('fast');
          else if (i % 4 === 3) this.spawnQueue.push('armor');
          else this.spawnQueue.push('basic');
        }

        this.respawnPlayer();
        this.state = 'PLAYING';
        sound.playStageStart();
        this.updateHUD();
      }

      respawnPlayer() {
        this.player = new PlayerTank(8 * TILE_SIZE, 24 * TILE_SIZE);
      }

      togglePause() {
        if (this.state === 'PLAYING') this.state = 'PAUSED';
        else if (this.state === 'PAUSED') this.state = 'PLAYING';
      }

      destroyBase() {
        this.map[24][12] = T_BASE_RUIN;
        this.map[24][13] = T_BASE_RUIN;
        this.map[25][12] = T_BASE_RUIN;
        this.map[25][13] = T_BASE_RUIN;
        this.spawnExplosion(13 * TILE_SIZE, 25 * TILE_SIZE, true);
        sound.playExplosion();
        this.gameOver();
      }

      gameOver() {
        this.state = 'GAMEOVER';
        sound.playGameOver();
      }

      checkStageClear() {
        if (this.spawnQueue.length === 0 && this.enemies.filter(e => e.alive).length === 0) {
          this.state = 'STAGECLEAR';
          sound.playPowerup();
        }
      }

      spawnPowerup(x, y) {
        const types = ['star', 'bomb', 'timer', 'shield', 'shovel'];
        const chosen = types[Math.floor(Math.random() * types.length)];
        this.powerups.push(new Powerup(x, y, chosen));
      }

      spawnExplosion(x, y, isBig = false) {
        this.explosions.push(new Explosion(x, y, isBig));
      }

      spawnSparks(x, y, color = '#ffeb3b') {
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 60 + 20;
          this.particles.push(new Particle(
            x, y, color, 2,
            Math.cos(angle) * spd,
            Math.sin(angle) * spd,
            0.15 + Math.random() * 0.1
          ));
        }
      }

      checkAABB(x1, y1, w1, h1, x2, y2, w2, h2) {
        return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
      }

      checkTileCollisionOnly(x, y, size) {
        if (x < 0 || x > CANVAS_WIDTH - size || y < 0 || y > CANVAS_HEIGHT - size) return true;
        const left = Math.floor(x / TILE_SIZE);
        const right = Math.floor((x + size - 1) / TILE_SIZE);
        const top = Math.floor(y / TILE_SIZE);
        const bottom = Math.floor((y + size - 1) / TILE_SIZE);

        for (let r = top; r <= bottom; r++) {
          for (let c = left; c <= right; c++) {
            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
              const tile = this.map[r][c];
              if (tile === T_BRICK || tile === T_STEEL || tile === T_WATER || tile === T_BASE || tile === T_BASE_RUIN) {
                return true;
              }
            }
          }
        }
        return false;
      }

      checkTankObstacleCollision(nx, ny, size, selfTank) {
        if (this.checkTileCollisionOnly(nx, ny, size)) return true;

        const allTanks = [...this.enemies];
        if (this.player && this.player.alive) allTanks.push(this.player);

        for (let tank of allTanks) {
          if (tank !== selfTank && tank.alive) {
            if (this.checkAABB(nx, ny, size, size, tank.x, tank.y, tank.size, tank.size)) {
              // If already overlapping, allow moving away (unstick mechanism)
              const curDist = Math.hypot(
                (selfTank.x + selfTank.size / 2) - (tank.x + tank.size / 2),
                (selfTank.y + selfTank.size / 2) - (tank.y + tank.size / 2)
              );
              const nextDist = Math.hypot(
                (nx + size / 2) - (tank.x + tank.size / 2),
                (ny + size / 2) - (tank.y + tank.size / 2)
              );

              // If moving increases center-to-center distance, ALLOW it so tanks can separate!
              if (curDist < (selfTank.size + tank.size) / 2 && nextDist > curDist) {
                continue;
              }
              return true;
            }
          }
        }
        return false;
      }

      updateHUD() {
        document.getElementById('hudLives').innerText = this.playerLives;
        document.getElementById('hudScore').innerText = this.score;
        document.getElementById('hudStage').innerText = this.stage;
        document.getElementById('hudEnemies').innerText = this.spawnQueue.length + this.enemies.filter(e => e.alive).length;
      }

      update(dt) {
        if (this.state !== 'PLAYING') return;

        if (this.freezeTimer > 0) this.freezeTimer -= dt;

        if (this.shovelTimer > 0) {
          this.shovelTimer -= dt;
          if (this.shovelTimer <= 0) {
            for (let r = 23; r <= 25; r++) {
              for (let c = 11; c <= 14; c++) {
                if (!(r >= 24 && (c === 12 || c === 13))) this.map[r][c] = T_BRICK;
              }
            }
          }
        }

        // Active Overlap Depenetration (Gently pushes overlapping tanks apart)
        const allActiveTanks = [...this.enemies];
        if (this.player && this.player.alive) allActiveTanks.push(this.player);

        for (let i = 0; i < allActiveTanks.length; i++) {
          for (let j = i + 1; j < allActiveTanks.length; j++) {
            const t1 = allActiveTanks[i];
            const t2 = allActiveTanks[j];
            if (t1.alive && t2.alive && this.checkAABB(t1.x, t1.y, t1.size, t1.size, t2.x, t2.y, t2.size, t2.size)) {
              let dx = (t1.x + t1.size / 2) - (t2.x + t2.size / 2);
              let dy = (t1.y + t1.size / 2) - (t2.y + t2.size / 2);
              if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) {
                dx = Math.random() > 0.5 ? 1 : -1;
                dy = 0;
              }
              const dist = Math.hypot(dx, dy) || 1;
              const overlap = (t1.size + t2.size) / 2 - dist;
              if (overlap > 0) {
                const push = Math.min(overlap / 2 + 0.5, 2.5);
                const px = (dx / dist) * push;
                const py = (dy / dist) * push;
                if (!this.checkTileCollisionOnly(t1.x + px, t1.y + py, t1.size)) {
                  t1.x += px;
                  t1.y += py;
                }
                if (!this.checkTileCollisionOnly(t2.x - px, t2.y - py, t2.size)) {
                  t2.x -= px;
                  t2.y -= py;
                }
              }
            }
          }
        }

        // Mobile Player Controls: D-Pad Direction + Firing
        if (this.player && this.player.alive) {
          this.player.shieldTimer = Math.max(0, this.player.shieldTimer - dt);
          this.player.reloadTimer -= dt;

          if (this.touchDir !== null) {
            this.player.move(dt, this.touchDir, this);
          }

          // A button (Main Fire) or B button (Turbo Rapid Fire)
          if (this.isFiringA || this.isFiringB) {
            if (this.isFiringB) {
              this.player.reloadTimer = Math.min(this.player.reloadTimer, 0.18);
            }
            this.player.fire(this);
          }
        }

        // Spawn Enemies (Only in non-blocked spawn slots)
        this.spawnTimer += dt;
        if (this.spawnTimer > 2.5 && this.spawnQueue.length > 0 && this.enemies.filter(e => e.alive).length < 4) {
          const spawnCols = [0, 12, 24];
          const validCols = spawnCols.filter(col => {
            const sx = col * TILE_SIZE;
            const sy = 0;
            for (let t of allActiveTanks) {
              if (t.alive && this.checkAABB(sx, sy, 28, 28, t.x, t.y, t.size, t.size)) {
                return false;
              }
            }
            return true;
          });

          if (validCols.length > 0) {
            this.spawnTimer = 0;
            const sc = validCols[Math.floor(Math.random() * validCols.length)];
            const type = this.spawnQueue.shift();
            this.enemies.push(new EnemyTank(sc * TILE_SIZE, 0, type));
            this.updateHUD();
          }
        }

        for (let enemy of this.enemies) {
          if (enemy.alive) enemy.update(dt, this);
        }

        for (let bullet of this.bullets) {
          if (bullet.alive) bullet.update(dt, this);
        }
        this.bullets = this.bullets.filter(b => b.alive);

        for (let p of this.powerups) {
          p.update(dt);
          if (p.alive && this.player && this.player.alive) {
            if (this.checkAABB(this.player.x, this.player.y, this.player.size, this.player.size, p.x, p.y, p.size, p.size)) {
              p.alive = false;
              sound.playPowerup();
              this.score += 500;
              this.updateHUD();

              if (p.type === 'star') {
                this.player.speed = Math.min(145, this.player.speed + 15);
                this.player.reloadTime = Math.max(0.2, this.player.reloadTime - 0.08);
              } else if (p.type === 'shield') {
                this.player.shieldTimer = 8.0;
              } else if (p.type === 'bomb') {
                for (let enemy of this.enemies) {
                  if (enemy.alive) enemy.hit(999, this);
                }
              } else if (p.type === 'timer') {
                this.freezeTimer = 8.0;
              } else if (p.type === 'shovel') {
                this.shovelTimer = 12.0;
                for (let r = 23; r <= 25; r++) {
                  for (let c = 11; c <= 14; c++) {
                    if (!(r >= 24 && (c === 12 || c === 13))) this.map[r][c] = T_STEEL;
                  }
                }
              }
            }
          }
        }
        this.powerups = this.powerups.filter(p => p.alive);

        for (let pt of this.particles) pt.update(dt);
        this.particles = this.particles.filter(pt => pt.life > 0);

        for (let ex of this.explosions) ex.update(dt);
        this.explosions = this.explosions.filter(ex => ex.alive);
      }

      draw() {
        const ctx = this.ctx;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        for (let r = 0; r < MAP_ROWS; r++) {
          for (let c = 0; c < MAP_COLS; c++) {
            const tile = this.map[r][c];
            const px = c * TILE_SIZE;
            const py = r * TILE_SIZE;

            if (tile === T_BRICK) {
              ctx.fillStyle = '#b7410e';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.fillStyle = '#3e1808';
              ctx.fillRect(px, py + 7, TILE_SIZE, 2);
              ctx.fillRect(px + 7, py, 2, 8);
              ctx.fillRect(px + 3, py + 8, 2, 8);
            } else if (tile === T_STEEL) {
              ctx.fillStyle = '#cfd8dc';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
              ctx.fillStyle = '#90a4ae';
              ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
            } else if (tile === T_WATER) {
              ctx.fillStyle = '#1e88e5';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.fillStyle = '#64b5f6';
              const wave = Math.floor(Date.now() / 250) % 2 * 3;
              ctx.fillRect(px + wave, py + 4, 8, 2);
              ctx.fillRect(px + 6 - wave, py + 10, 8, 2);
            } else if (tile === T_BASE) {
              if (r === 24 && c === 12) {
                ctx.fillStyle = '#ffb300';
                ctx.fillRect(px, py, TILE_SIZE * 2, TILE_SIZE * 2);
                ctx.fillStyle = '#d32f2f';
                ctx.fillRect(px + 4, py + 4, 24, 24);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(px + 16, py + 14, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff8f00';
                ctx.fillRect(px + 10, py + 18, 12, 10);
              }
            } else if (tile === T_BASE_RUIN) {
              if (r === 24 && c === 12) {
                ctx.fillStyle = '#424242';
                ctx.fillRect(px, py, TILE_SIZE * 2, TILE_SIZE * 2);
                ctx.fillStyle = '#ff5722';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('💀', px + 16, py + 22);
              }
            }
          }
        }

        for (let p of this.powerups) p.draw(ctx);
        if (this.player && this.player.alive) this.player.draw(ctx);
        for (let enemy of this.enemies) {
          if (enemy.alive) enemy.draw(ctx);
        }
        for (let bullet of this.bullets) bullet.draw(ctx);

        for (let r = 0; r < MAP_ROWS; r++) {
          for (let c = 0; c < MAP_COLS; c++) {
            if (this.map[r][c] === T_TREE) {
              const px = c * TILE_SIZE;
              const py = r * TILE_SIZE;
              ctx.fillStyle = '#2e7d32';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.fillStyle = '#4caf50';
              ctx.fillRect(px + 2, py + 2, 5, 5);
              ctx.fillRect(px + 9, py + 8, 5, 5);
            }
          }
        }

        for (let pt of this.particles) pt.draw(ctx);
        for (let ex of this.explosions) ex.draw(ctx);

        // Mobile Screen Overlays
        if (this.state === 'TITLE') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('像素坦克大战', CANVAS_WIDTH / 2, 135);

          ctx.fillStyle = '#bbb';
          ctx.font = '14px sans-serif';
          ctx.fillText('RETRO TANK 1990', CANVAS_WIDTH / 2, 170);

          ctx.fillStyle = '#ff3344';
          ctx.font = 'bold 16px sans-serif';
          const pulse = Math.floor(Date.now() / 400) % 2 === 0;
          if (pulse) {
            ctx.fillText('👉 点击屏幕开始游戏 👈', CANVAS_WIDTH / 2, 255);
          } else {
            ctx.fillStyle = '#ff8899';
            ctx.fillText('👉 点击屏幕开始游戏 👈', CANVAS_WIDTH / 2, 255);
          }

          ctx.fillStyle = '#888';
          ctx.font = '12px sans-serif';
          ctx.fillText('左手滑动十字键 | 右手 A/B 开火', CANVAS_WIDTH / 2, 320);
        } else if (this.state === 'PAUSED') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⏸ 游戏已暂停', CANVAS_WIDTH / 2, 190);
          ctx.font = '14px sans-serif';
          ctx.fillStyle = '#ffd700';
          ctx.fillText('轻触屏幕继续', CANVAS_WIDTH / 2, 235);
        } else if (this.state === 'GAMEOVER') {
          ctx.fillStyle = 'rgba(180, 0, 0, 0.5)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
          ctx.fillStyle = '#ff1744';
          ctx.font = 'bold 36px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 160);

          ctx.fillStyle = '#fff';
          ctx.font = '16px sans-serif';
          ctx.fillText(`最终得分: ${this.score}`, CANVAS_WIDTH / 2, 210);

          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('👉 点击屏幕重新挑战 👈', CANVAS_WIDTH / 2, 270);
        } else if (this.state === 'STAGECLEAR') {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
          ctx.fillStyle = '#4caf50';
          ctx.font = 'bold 30px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`第 ${this.stage} 关 胜利!`, CANVAS_WIDTH / 2, 160);

          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText('👉 点击屏幕进入下一关 👈', CANVAS_WIDTH / 2, 230);
        }
      }

      run() {
        const loop = (currentTime) => {
          const dt = Math.min((currentTime - this.lastTime) / 1000, 0.1);
          this.lastTime = currentTime;

          this.update(dt);
          this.draw();

          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    }

    window.addEventListener('load', () => {
      window.gameInstance = new Game();
      window.gameInstance.run();
    });
  </script>
</body>
</html>
