<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#101014">
  <title>Antigravity Retro Game Boy Console - 掌机模拟器</title>
  <link rel="stylesheet" href="css/gameboy.css">
</head>
<body>

  <!-- Game Boy DMG-01 Handheld Chassis -->
  <div id="gameboy-chassis">
    <!-- Top Shell Grooves -->
    <div class="shell-groove-top"></div>

    <!-- Screen Bezel Unit -->
    <div id="screen-bezel-unit">
      <div class="bezel-lines">
        <div class="bezel-line-top"></div>
        <div class="bezel-line-bottom"></div>
        <div class="bezel-text">DOT MATRIX WITH STEREO SOUND</div>
      </div>

      <div class="screen-housing">
        <!-- Battery Indicator LED -->
        <div class="battery-indicator">
          <div class="battery-led powered" id="battery-led"></div>
          <span class="battery-label">BATTERY</span>
        </div>

        <!-- LCD Screen Frame & Canvas/Iframe -->
        <div id="gb-screen-frame" class="palette-color">
          <div class="lcd-grid-overlay"></div>
          <iframe id="game-screen" src="games/tank-battle/index.html?embedded=1"></iframe>
          <div id="screen-off-overlay" class="hidden">
            <span>POWER OFF</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Middle Console Branding -->
    <div class="console-branding">
      <div class="brand-left">
        <span class="brand-name">Antigravity</span>
        <span class="brand-sub">GAME BOY<span style="font-size:7px;vertical-align:super">TM</span></span>
      </div>
      <div class="brand-right">DMG-01</div>
    </div>

    <!-- Lower Handheld Controls Deck -->
    <div id="lower-deck">
      <div class="primary-controls-row">
        <!-- Authentic Cross D-Pad with Slide Touch Support -->
        <div class="dpad-container" id="gb-dpad">
          <div class="dpad-well"></div>
          <div class="dpad-cross">
            <div class="dpad-btn up" id="dpad-up">▲</div>
            <div class="dpad-btn down" id="dpad-down">▼</div>
            <div class="dpad-btn left" id="dpad-left">◀</div>
            <div class="dpad-btn right" id="dpad-right">▶</div>
            <div class="dpad-center"></div>
          </div>
        </div>

        <!-- Slanted Action A & B Buttons -->
        <div class="ab-buttons-container">
          <!-- B Button -->
          <div class="ab-unit">
            <div class="ab-btn" id="gb-btn-b"></div>
            <span class="ab-label">B</span>
          </div>
          <!-- A Button -->
          <div class="ab-unit">
            <div class="ab-btn" id="gb-btn-a"></div>
            <span class="ab-label">A</span>
          </div>
        </div>
      </div>

      <!-- Pill Shaped Rubber SELECT & START Buttons -->
      <div class="select-start-row">
        <div class="rubber-pill-unit">
          <div class="rubber-pill-btn" id="gb-btn-select"></div>
          <span class="rubber-label">SELECT</span>
        </div>
        <div class="rubber-pill-unit">
          <div class="rubber-pill-btn" id="gb-btn-start"></div>
          <span class="rubber-label">START</span>
        </div>
      </div>

      <!-- Speaker Grille Slits (Bottom Right) -->
      <div class="speaker-grille">
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
      </div>
    </div>
  </div>

  <!-- Cartridge Switcher Modal -->
  <div id="cartridge-modal" class="hidden">
    <div class="modal-card">
      <div class="modal-title">💾 选择游戏卡带 (Cartridges)</div>
      <div class="cartridge-list">
        <!-- Cartridge 1: Tank Battle -->
        <div class="cartridge-item active" data-cart="tank-battle">
          <div class="cart-icon">🎮</div>
          <div class="cart-info">
            <div class="cart-name">像素坦克大战 1990</div>
            <div class="cart-desc">Pixel Tank Battle · 向量解耦物理 · 8-Bit 芯片音效</div>
          </div>
        </div>

        <!-- Cartridge 2: Space Invaders -->
        <div class="cartridge-item" data-cart="space-invaders">
          <div class="cart-icon">👾</div>
          <div class="cart-info">
            <div class="cart-name">太空侵略者 1978</div>
            <div class="cart-desc">Space Invaders · 可破坏掩体 · 经典四音步进</div>
          </div>
        </div>

        <!-- Cartridge 3: Tutorial Guide -->
        <div class="cartridge-item" data-cart="tutorial">
          <div class="cart-icon">📖</div>
          <div class="cart-info">
            <div class="cart-name">Termux 自动化开发全攻略</div>
            <div class="cart-desc">Shizuku 提权 · MT 管理器 MCP · 移动极客指南</div>
          </div>
        </div>
      </div>

      <button class="modal-close-btn" id="modal-close-btn">返回游戏</button>
    </div>
  </div>

  <!-- Bottom System Bar (Moved from top to bottom so it doesn't block screen) -->
  <div id="bottom-bar">
    <button class="bottom-pill active" id="top-btn-power">⚡ 电源: 开</button>
    <button class="bottom-pill" id="top-btn-cartridge">💾 换卡带</button>
    <button class="bottom-pill" id="top-btn-palette">🎨 原彩</button>
    <button class="bottom-pill" id="top-btn-fullscreen">⛶ 全屏</button>
  </div>

  <!-- Console Engine Script -->
  <script src="js/console.js"></script>
</body>
</html>
